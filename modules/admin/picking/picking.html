<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhặt Hàng - EzGear Admin</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Admin Common CSS -->
    <link rel="stylesheet" href="../admin-common.css">
    
    <!-- Custom CSS -->
    <link href="./picking.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay active" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div id="topbar-container" data-title="Nhặt Hàng" data-breadcrumb='<a href="../dashboard.html">Trang chủ</a> / <a href="./picking.html">Nhặt hàng</a>'></div>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <!-- Filter Tabs -->
                <div class="filter-tabs-container">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> Tất cả
                    </button>
                    <button class="filter-btn" data-filter="urgent">
                        <i class="fas fa-exclamation-triangle"></i> Gấp
                    </button>
                    <button class="filter-btn" data-filter="large">
                        <i class="fas fa-box-open"></i> Đơn lớn
                    </button>
                </div>
                <!-- List View -->
                <div id="listView" class="view-container active">
                    <div class="order-count" id="orderCount">
                        <i class="fas fa-box"></i>
                        <span>Đang tải...</span>
                    </div>
                    <div class="order-list" id="orderList">
                        <!-- Loading spinner -->
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Đang tải danh sách đơn hàng...</p>
                        </div>
                    </div>
                </div>

                <!-- Detail View -->
                <div id="detailView" class="view-container">
                    <div class="detail-header-card">
                        <button class="btn-back" onclick="backToList()">
                            <i class="fas fa-arrow-left"></i>
                            <span>Quay lại</span>
                        </button>
                        <div class="detail-order-info">
                            <div class="order-code" id="detailOrderCode">#ORD-12345</div>
                            <div class="order-time" id="detailOrderTime">Đặt cách đây 2 giờ</div>
                        </div>
                    </div>

                    <div class="detail-customer-info" id="detailCustomerInfo">
                        <div class="info-item">
                            <i class="fas fa-user"></i>
                            <span id="customerName">---</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-phone"></i>
                            <span id="customerPhone">---</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span id="customerAddress">---</span>
                        </div>
                    </div>

                    <div class="picking-items" id="pickingItems">
                        <!-- Items will be rendered here -->
                    </div>

                    <div class="detail-footer">
                        <div class="progress-info">
                            <span id="pickedCount">0</span>/<span id="totalCount">0</span> sản phẩm đã nhặt
                        </div>
                        <button class="btn-confirm" id="btnConfirm" disabled onclick="confirmPacking()">
                            <i class="fas fa-check-circle"></i>
                            <span>Xác nhận đóng gói</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../config.js?v=1"></script>
    <script src="../admin-common.js"></script>
    <script src="./picking.js"></script>
</body>
</html>
