<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Thanh Toán - EzGear</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #d70018;
            --success-color: #28a745;
            --error-color: #dc3545;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .result-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }
        
        .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        
        .icon-success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
        }
        
        .icon-error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
        }
        
        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #333;
        }
        
        .result-message {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .order-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 30px;
        }
        
        .order-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .order-code {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            letter-spacing: 1px;
        }
        
        .btn-primary-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            padding: 12px 30px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 12px;
        }
        
        .btn-primary-custom:hover {
            background-color: #b00014;
            border-color: #b00014;
            color: white;
        }
        
        .btn-outline-custom {
            color: #666;
            border: 1px solid #ddd;
            padding: 12px 30px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s;
            width: 100%;
            background: white;
        }
        
        .btn-outline-custom:hover {
            background-color: #f8f9fa;
            color: #333;
            border-color: #ccc;
        }
    </style>
</head>
<body>

    <div class="result-card">
        <!-- Content will be injected by JS -->
        <div id="loadingState">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Đang xử lý kết quả...</p>
        </div>
        
        <div id="resultContent" style="display: none;">
            <div id="iconWrapper" class="icon-wrapper">
                <i id="resultIcon" class="fas"></i>
            </div>
            
            <h1 id="resultTitle" class="result-title"></h1>
            <p id="resultMessage" class="result-message"></p>
            
            <div id="orderInfo" class="order-info" style="display: none;">
                <div class="order-label">Mã đơn hàng</div>
                <div id="orderCode" class="order-code"></div>
            </div>
            
            <div class="actions">
                <button id="primaryBtn" class="btn btn-primary-custom mb-2"></button>
                <button id="secondaryBtn" class="btn btn-outline-custom"></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="./payment-result.js"></script>
</body>
</html>
