<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - EzGear</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="./order.css" rel="stylesheet">
</head>
<body>
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <div class="container my-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2">
                <div class="profile-sidebar">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User">
                        </div>
                        <div class="profile-info">
                            <div class="profile-name" id="sidebarName">User</div>
                            <a href="#" class="profile-edit"><i class="fas fa-pen"></i> Sửa hồ sơ</a>
                        </div>
                    </div>
                    <div class="profile-menu">
                        <a href="#" class="menu-item">
                            <div class="menu-icon"><i class="fas fa-user"></i></div>
                            <span>Tài khoản của tôi</span>
                        </a>
                        <a href="#" class="menu-item active">
                            <div class="menu-icon"><i class="fas fa-file-alt"></i></div>
                            <span>Đơn Mua</span>
                        </a>
                        
                    </div>
                </div>
            </div>

            <!-- Order Content -->
            <div class="col-md-9 col-lg-10">
                <!-- Tabs -->
                <div class="order-tabs" id="orderTabs">
                    <div class="tab-item active" data-status="ALL">Tất cả</div>
                    <div class="tab-item" data-status="WAITING_PAYMENT">Chờ thanh toán</div>
                    <div class="tab-item" data-status="PENDING_SHIPMENT">Chờ lấy hàng</div>
                    <div class="tab-item" data-status="SHIPPING">Đang giao</div>
                    <div class="tab-item" data-status="COMPLETED">Hoàn thành</div>
                    <div class="tab-item" data-status="CANCELLED">Đã hủy</div>
                </div>

                <!-- Search -->
                <div class="order-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchOrderInput" placeholder="Tìm kiếm theo ID đơn hàng hoặc Tên sản phẩm">
                </div>

                <!-- Order List -->
                <div class="order-list" id="ordersList">
                    <!-- Orders will be rendered here by JS -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-danger" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../config.js?v=1"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="./order.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await ComponentLoader.load("#header-container", "../../components/header.html");
        });
    </script>
</body>
</html>
