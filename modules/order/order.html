<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - EzGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/base.css" rel="stylesheet">
    <link href="./order.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="shop-header fixed-top shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between align-items-center" style="height: 70px;">
                <div class="d-flex align-items-center gap-3">
                    <a href="../product/shop.html" class="shop-logo text-white text-decoration-none">EzGear</a>
                    <h1 class="h4 mb-0 text-white border-start border-white border-opacity-25 ps-3">Đơn Mua</h1>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2 text-white" id="userInfo">
                        <div class="bg-white text-danger rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <span id="usernameDisplay" class="fw-medium">Tài khoản</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mt-5 pt-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2">
                <div class="profile-sidebar">
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                        <img src="../../assets/img/placeholder.svg" alt="Avatar" class="profile-avatar-img" id="sidebarAvatar" onerror="this.style.display='none'">
                        <div class="profile-info">
                            <div class="profile-name" id="sidebarName">User Name</div>
                            <a href="#" class="profile-edit">
                                <i class="fas fa-pen"></i> Sửa hồ sơ
                            </a>
                        </div>
                    </div>
                    <ul class="profile-menu">
                        <li>
                            <a href="../address/index.html" class="menu-item">
                                <div class="menu-icon"><i class="fas fa-user"></i></div>
                                <span>Tài khoản của tôi</span>
                            </a>
                        </li>
                        <li>
                            <a href="order.html" class="menu-item active">
                                <div class="menu-icon"><i class="fas fa-file-alt"></i></div>
                                <span>Đơn Mua</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <div class="menu-icon"><i class="fas fa-bell"></i></div>
                                <span>Thông báo</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="menu-item">
                                <div class="menu-icon"><i class="fas fa-ticket-alt"></i></div>
                                <span>Kho Voucher</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10">
                <!-- Order Tabs -->
                <div class="order-tabs-wrapper">
                    <ul class="order-tabs nav" id="orderTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" onclick="filterOrders('ALL')">Tất cả</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('PENDING_CONFIRMATION')">Chờ xác nhận</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('PENDING_SHIPMENT')">Vận chuyển</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('PENDING_DELIVERY')">Đang giao</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('COMPLETED')">Hoàn thành</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('CANCELLED')">Đã hủy</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="filterOrders('REFUND_PENDING')">Trả hàng/Hoàn tiền</button>
                        </li>
                    </ul>
                </div>

                <!-- Search Box -->
                <div class="search-order-box">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control" id="searchOrderInput" 
                               placeholder="Tìm kiếm theo ID đơn hàng hoặc Tên sản phẩm">
                    </div>
                </div>

                <!-- Orders List Container -->
                <div id="ordersList">
                    <!-- Orders will be injected here by JS -->
                </div>

                <!-- Empty State -->
                <div class="empty-orders text-center" id="emptyState" style="display: none;">
                    <i class="fas fa-clipboard-list fa-4x mb-3"></i>
                    <h5 class="text-muted">Chưa có đơn hàng</h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="order.js"></script>
</body>
</html>
