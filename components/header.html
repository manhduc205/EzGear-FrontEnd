<div class="shop-header">
    <div class="shop-header-inner">
        <div class="shop-header-left">
            <i class="fas fa-store shop-logo"></i>
            <h1>EzGear</h1>
        </div>

        <div class="shop-header-center">
            <form class="header-search-form" onsubmit="handleSearch(event)">
                <input 
                    type="text" 
                    class="header-search-input" 
                    id="searchInput"
                    placeholder="Tìm kiếm sản phẩm (VD: chuột, bàn phím...)"
                    autocomplete="off"
                >
            </form>
        </div>

        <div class="shop-header-right">
            <!-- Location Picker -->
            <div class="header-location" id="headerLocation" onclick="openLocationModal()">
                <div class="location-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="location-text">
                    <span class="text-small">Xem giá tại</span>
                    <span class="text-large">Hà Nội</span>
                </div>
                <i class="fas fa-chevron-down location-arrow"></i>
            </div>

            <button class="btn-cart" onclick="window.location.href='../cart/cart.html'">
                <i class="fas fa-shopping-cart"></i>
                <span>Giỏ Hàng</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
            
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar" style="display: none;">U</div>
                <span class="user-name" id="userName">Đăng nhập</span>
                <i class="fas fa-chevron-down" id="userDropdownIcon" style="font-size: 0.8rem; color: rgba(255,255,255,0.8); display: none;"></i>
                
                <!-- User Dropdown Menu -->
                <div class="user-dropdown" id="userDropdown">
                    <a href="/modules/profile/profile.html" class="dropdown-item">
                        <i class="fas fa-user"></i> Thông tin cá nhân
                    </a>
                    <a href="/modules/order/order.html" class="dropdown-item">
                        <i class="fas fa-file-alt"></i> Đơn hàng của tôi
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Location Modal -->
<div class="modal" id="locationModal">
    <div class="modal-content location-modal">
        <div class="modal-header location-header">
            <div class="location-search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="locationSearchInput" placeholder="Nhập tên tỉnh thành" oninput="handleLocationSearch()">
            </div>
            <button class="btn-close-location" onclick="closeLocationModal()">
                Đóng <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body location-body">
            <p class="location-instruction">Vui lòng chọn tỉnh, thành phố để biết chính xác giá, khuyến mãi và tồn kho</p>
            <div class="location-list" id="locationList">
                <!-- Locations will be rendered here -->
                <div class="loading-spinner" style="margin: 20px auto;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== LOCATION LOGIC ====================
    
    // State for location management
    const LocationState = {
        locations: [],
        selectedLocation: null // { id, name }
    };

    // Make functions global
    window.openLocationModal = function() {
        const modal = document.getElementById('locationModal');
        if (modal) {
            modal.classList.add('show');
            // Fetch locations if not loaded
            if (LocationState.locations.length === 0) {
                fetchLocations().then(() => {
                    renderLocationList(LocationState.locations);
                });
            } else {
                renderLocationList(LocationState.locations);
            }
            document.getElementById('locationSearchInput').value = '';
            document.getElementById('locationSearchInput').focus();
        }
    };

    window.closeLocationModal = function() {
        const modal = document.getElementById('locationModal');
        if (modal) {
            modal.classList.remove('show');
        }
    };

    window.handleLocationSearch = function() {
        const input = document.getElementById('locationSearchInput');
        const filter = input.value.toLowerCase();
        const filtered = LocationState.locations.filter(loc => 
            loc.name.toLowerCase().includes(filter)
        );
        renderLocationList(filtered);
    };

    window.selectLocation = function(id, name) {
        const locationObj = { id, name };
        localStorage.setItem('selectedLocation', JSON.stringify(locationObj));
        LocationState.selectedLocation = locationObj;
        
        updateHeaderLocation(name);
        closeLocationModal();
        
        // Dispatch event for other components to listen
        window.dispatchEvent(new CustomEvent('locationChanged', { detail: locationObj }));
        
        // Optional: Reload if needed, but event dispatch is better
        // window.location.reload(); 
    };

    async function fetchLocations() {
        const list = document.getElementById('locationList');
        if (list) list.innerHTML = '<div class="loading-spinner" style="margin: 20px auto;"></div>';

        try {
            const token = typeof TokenHelper !== 'undefined' ? TokenHelper.getAccessToken() : null;
            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            // Use window.BASE_URL from config.js, fallback if not available
            const baseUrl = window.BASE_URL || 'http://localhost:8080';
            const response = await fetch(`${baseUrl}/api/locations`, {
                headers: headers
            });
            
            if (!response.ok) throw new Error('Failed to fetch locations');
            
            const data = await response.json();
            const locations = Array.isArray(data) ? data : (data.payload || []);
            
            if (locations.length > 0) {
                LocationState.locations = locations;
            } else {
                throw new Error('No data');
            }
        } catch (error) {
            console.warn('Failed to fetch locations, using fallback:', error);
            // Fallback data matching cart.js
            LocationState.locations = [
                { id: 1, name: 'Hà Nội' },
                { id: 2, name: 'Hồ Chí Minh' }
            ];
        }
    }

    function renderLocationList(locations) {
        const list = document.getElementById('locationList');
        if (!list) return;

        const currentId = LocationState.selectedLocation?.id;
        
        if (locations.length === 0) {
            list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px;">Không tìm thấy kết quả</div>';
            return;
        }

        list.innerHTML = locations.map(loc => `
            <div class="location-item ${loc.id === currentId ? 'selected' : ''}" onclick="selectLocation(${loc.id}, '${loc.name}')">
                <span>${loc.name}</span>
                <i class="fas fa-check"></i>
            </div>
        `).join('');
    }

    function updateHeaderLocation(locationName) {
        const locationText = document.querySelector('#headerLocation .location-text .text-large');
        if (locationText) {
            locationText.textContent = locationName;
        }
    }

    // Initialize Location
    (function initLocation() {
        const savedLoc = localStorage.getItem('selectedLocation');
        let locationName = 'Hà Nội';
        let locationId = null;

        if (savedLoc) {
            try {
                // Try to parse as JSON object {id, name}
                const parsed = JSON.parse(savedLoc);
                if (parsed && parsed.name) {
                    locationName = parsed.name;
                    locationId = parsed.id;
                    LocationState.selectedLocation = parsed;
                } else {
                    // Handle legacy string format
                    locationName = savedLoc;
                }
            } catch (e) {
                // Not JSON, assume string
                locationName = savedLoc;
            }
        } else {
            // Default
            const defaultLoc = { id: 201, name: 'Hà Nội' }; // Mock ID for default
            localStorage.setItem('selectedLocation', JSON.stringify(defaultLoc));
            LocationState.selectedLocation = defaultLoc;
        }

        updateHeaderLocation(locationName);
    })();

    // ==================== USER INFO LOGIC ====================
    (function() {
        const userInfo = document.getElementById('userInfo');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        // Toggle Dropdown
        // Logic moved to userInfo.onclick below to handle login check
        if (userDropdown) {
             // Close dropdown when clicking outside
            document.addEventListener('click', () => {
                userDropdown.classList.remove('show');
            });
        }

        // Logout Logic
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // Assuming TokenHelper is available globally
                if (typeof TokenHelper !== 'undefined') {
                    TokenHelper.clearTokens();
                } else {
                    localStorage.clear();
                }
                window.location.href = '/modules/auth/auth.html';
            });
        }
        
        // Update User Info from LocalStorage
        const userNameEl = document.getElementById('userName');
        const userAvatarEl = document.getElementById('userAvatar');
        const userDropdownIcon = document.getElementById('userDropdownIcon');
        
        let isLoggedIn = false;

        if (typeof TokenHelper !== 'undefined') {
            const user = TokenHelper.getUserInfo();
            if (user && userNameEl) {
                isLoggedIn = true;
                
                // Logic to display only the first name (last word)
                let displayName = user.username;
                if (displayName) {
                    const parts = displayName.trim().split(/\s+/);
                    if (parts.length > 0) {
                        displayName = parts[parts.length - 1];
                    }
                } else {
                    displayName = "User";
                }

                userNameEl.textContent = displayName;
                if (userAvatarEl) {
                    userAvatarEl.textContent = displayName.charAt(0).toUpperCase();
                    userAvatarEl.style.display = 'flex';
                }
                if (userDropdownIcon) {
                    userDropdownIcon.style.display = 'block';
                }
            }
        }

        // Handle User Info Click
        if (userInfo) {
            // Remove previous event listener if any (though this is IIFE)
            // We need to handle click differently based on login status
            userInfo.onclick = (e) => {
                if (!isLoggedIn) {
                    e.preventDefault();
                    window.location.href = '/modules/auth/auth.html';
                } else {
                    e.stopPropagation();
                    if (userDropdown) {
                        userDropdown.classList.toggle('show');
                    }
                }
            };
        }
    })();
</script>
