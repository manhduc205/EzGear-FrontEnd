<script>
    // ==================== LOCATION LOGIC ====================
    
    // State for location management
    const LocationState = {
        locations: [],
        selectedLocation: null // { id, name }
    };

    // Make functions global
    window.openLocationModal = function() {
        const modal = document.getElementById('locationModal');
        if (modal) {
            modal.classList.add('show');
            // Fetch locations if not loaded
            if (LocationState.locations.length === 0) {
                fetchLocations().then(() => {
                    renderLocationList(LocationState.locations);
                });
            } else {
                renderLocationList(LocationState.locations);
            }
            document.getElementById('locationSearchInput').value = '';
            document.getElementById('locationSearchInput').focus();
        }
    };

    window.closeLocationModal = function() {
        const modal = document.getElementById('locationModal');
        if (modal) {
            modal.classList.remove('show');
        }
    };

    window.handleLocationSearch = function() {
        const input = document.getElementById('locationSearchInput');
        const filter = input.value.toLowerCase();
        const filtered = LocationState.locations.filter(loc => 
            loc.name.toLowerCase().includes(filter)
        );
        renderLocationList(filtered);
    };

    window.selectLocation = function(id, name) {
        const locationObj = { id, name };
        localStorage.setItem('selectedLocation', JSON.stringify(locationObj));
        LocationState.selectedLocation = locationObj;
        
        updateHeaderLocation(name);
        closeLocationModal();
        
        // Dispatch event for other components to listen
        window.dispatchEvent(new CustomEvent('locationChanged', { detail: locationObj }));
        
        // Optional: Reload if needed, but event dispatch is better
        // window.location.reload(); 
    };

    async function fetchLocations() {
        const list = document.getElementById('locationList');
        if (list) list.innerHTML = '<div class="loading-spinner" style="margin: 20px auto;"></div>';

        try {
            const token = typeof TokenHelper !== 'undefined' ? TokenHelper.getAccessToken() : null;
            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            // Use window.BASE_URL from config.js, fallback if not available
            const baseUrl = window.BASE_URL || 'http://localhost:8080';
            const response = await fetch(`${baseUrl}/api/locations`, {
                headers: headers
            });
            
            if (!response.ok) throw new Error('Failed to fetch locations');
            
            const data = await response.json();
            const locations = Array.isArray(data) ? data : (data.payload || []);
            
            if (locations.length > 0) {
                LocationState.locations = locations;
            } else {
                throw new Error('No data');
            }
        } catch (error) {
            console.warn('Failed to fetch locations, using fallback:', error);
            // Fallback data
            LocationState.locations = [
                { id: 201, name: 'Hà Nội' },
                { id: 202, name: 'Hồ Chí Minh' },
                { id: 203, name: 'Đà Nẵng' }
            ];
        }
    }

    function renderLocationList(locations) {
        const list = document.getElementById('locationList');
        if (!list) return;

        const currentId = LocationState.selectedLocation?.id;
        
        if (locations.length === 0) {
            list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px;">Không tìm thấy kết quả</div>';
            return;
        }

        list.innerHTML = locations.map(loc => `
            <div class="location-item ${loc.id === currentId ? 'selected' : ''}" onclick="selectLocation(${loc.id}, '${loc.name}')">
                <span>${loc.name}</span>
                <i class="fas fa-check"></i>
            </div>
        `).join('');
    }

    function updateHeaderLocation(locationName) {
        const locationText = document.querySelector('#headerLocation .location-text .text-large');
        if (locationText) {
            locationText.textContent = locationName;
        }
    }

    // Initialize Location
    (function initLocation() {
        const savedLoc = localStorage.getItem('selectedLocation');
        let locationName = 'Hà Nội';
        let locationId = null;

        if (savedLoc) {
            try {
                // Try to parse as JSON object {id, name}
                const parsed = JSON.parse(savedLoc);
                if (parsed && parsed.name) {
                    locationName = parsed.name;
                    locationId = parsed.id;
                    LocationState.selectedLocation = parsed;
                } else {
                    // Handle legacy string format
                    locationName = savedLoc;
                }
            } catch (e) {
                // Not JSON, assume string
                locationName = savedLoc;
            }
        } else {
            // Default
            const defaultLoc = { id: 201, name: 'Hà Nội' }; // Mock ID for default
            localStorage.setItem('selectedLocation', JSON.stringify(defaultLoc));
            LocationState.selectedLocation = defaultLoc;
        }

        updateHeaderLocation(locationName);
    })();

    // Listen for location changes from other pages (e.g., product-detail)
    window.addEventListener('locationChanged', (e) => {
        if (e.detail && e.detail.name) {
            LocationState.selectedLocation = e.detail;
            updateHeaderLocation(e.detail.name);
        }
    });

    // ==================== USER INFO LOGIC ====================
    (function() {
        const userInfo = document.getElementById('userInfo');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        // Toggle Dropdown
        // Logic moved to userInfo.onclick below to handle login check
        if (userDropdown) {
             // Close dropdown when clicking outside
            document.addEventListener('click', () => {
                userDropdown.classList.remove('show');
            });
        }

        // Logout Logic
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // Assuming TokenHelper is available globally
                if (typeof TokenHelper !== 'undefined') {
                    TokenHelper.clearTokens();
                } else {
                    localStorage.clear();
                }
                window.location.href = '/modules/auth/auth.html';
            });
        }
        
        // Update User Info from LocalStorage
        const userNameEl = document.getElementById('userName');
        const userAvatarEl = document.getElementById('userAvatar');
        const userDropdownIcon = document.getElementById('userDropdownIcon');
        
        let isLoggedIn = false;

        if (typeof TokenHelper !== 'undefined') {
            const user = TokenHelper.getUserInfo();
            if (user && userNameEl) {
                isLoggedIn = true;
                
                // Logic to display only the first name (last word)
                let displayName = user.username;
                if (displayName) {
                    const parts = displayName.trim().split(/\s+/);
                    if (parts.length > 0) {
                        displayName = parts[parts.length - 1];
                    }
                } else {
                    displayName = "User";
                }

                userNameEl.textContent = displayName;
                if (userAvatarEl) {
                    userAvatarEl.textContent = displayName.charAt(0).toUpperCase();
                    userAvatarEl.style.display = 'flex';
                }
                if (userDropdownIcon) {
                    userDropdownIcon.style.display = 'block';
                }
            }
        }

        // Handle User Info Click
        if (userInfo) {
            // Remove previous event listener if any (though this is IIFE)
            // We need to handle click differently based on login status
            userInfo.onclick = (e) => {
                if (!isLoggedIn) {
                    e.preventDefault();
                    window.location.href = '/modules/auth/auth.html';
                } else {
                    e.stopPropagation();
                    if (userDropdown) {
                        userDropdown.classList.toggle('show');
                    }
                }
            };
        }
    })();

    // ==================== SEARCH FUNCTIONALITY ====================
    (function() {
        // Search State
        const SearchState = {
            debounceTimer: null,
            debounceDelay: 500, // 500ms delay
            isLoading: false,
            lastKeyword: '',
            suggestions: []
        };

        // Category suggestions based on keywor

        // Get category suggestions based on keyword (async API call)
        async function getCategorySuggestions(keyword) {
            if (!keyword || keyword.length < 2) return [];
            
            try {
                const baseUrl = window.BASE_URL || 'http://127.0.0.1:8080';
                
                // 📡 Fetch all categories from API
                const response = await fetch(`${baseUrl}/api/categories`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Extract categories from response
                const categories = data.payload || data || [];
                
                // Filter categories by keyword
                const lowerKeyword = keyword.toLowerCase();
                const filtered = categories.filter(cat => 
                    cat.name.toLowerCase().includes(lowerKeyword) ||
                    (cat.slug && cat.slug.toLowerCase().includes(lowerKeyword))
                );
                
                // Return category names, limit to 5
                return filtered.slice(0, 5).map(cat => cat.name);
            } catch (error) {
                console.error('❌ Error loading category suggestions:', error);
                return [];
            }
        }

        // Format price to VND
        function formatPrice(price) {
            if (!price && price !== 0) return '0đ';
            return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
        }

        // Generate star rating HTML with Font Awesome icons
        function generateStars(rating) {
            const full = Math.floor(rating || 0);
            const hasHalf = ((rating || 0) - full) >= 0.5;
            const remaining = 5 - full - (hasHalf ? 1 : 0);
            
            let starsHtml = '';
            
            // Full stars
            for (let i = 0; i < full; i++) {
                starsHtml += '<i class="fas fa-star" style="color: #FFD700;"></i>';
            }
            
            // Half star
            if (hasHalf) {
                starsHtml += '<i class="fas fa-star-half-alt" style="color: #FFD700;"></i>';
            }
            
            // Empty stars
            for (let i = 0; i < remaining; i++) {
                starsHtml += '<i class="far fa-star" style="color: #e0e0e0;"></i>';
            }
            
            return starsHtml;
        }

        // Search products via Elasticsearch API
        async function searchProducts(keyword) {
            if (!keyword || keyword.trim().length < 2) return [];
            
            try {
                const baseUrl = window.BASE_URL || 'http://127.0.0.1:8080';
                const params = new URLSearchParams({
                    keyword: keyword.trim(),
                    sortBy: 'relevance',
                    order: 'desc',
                    page: '0',
                    limit: '5'
                });
                
                const response = await fetch(`${baseUrl}/api/products/search/es?${params}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.payload?.content) {
                    return data.payload.content;
                }
                
                return [];
            } catch (error) {
                console.error('❌ Search error:', error);
                return [];
            }
        }

        // Render suggestions (now async)
        async function renderSuggestions(keyword) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            const suggestionList = document.getElementById('suggestionList');
            
            if (!suggestionsContainer || !suggestionList) return;
            
            const suggestions = await getCategorySuggestions(keyword);
            
            if (suggestions.length === 0) {
                suggestionsContainer.classList.remove('show');
                return;
            }
            
            suggestionList.innerHTML = suggestions.map(suggestion => `
                <a href="/modules/product/shop-list.html?search=${encodeURIComponent(suggestion)}" 
                   onclick="handleSuggestionClick('${suggestion}')">
                    ${suggestion}
                </a>
            `).join('');
            
            suggestionsContainer.classList.add('show');
        }

        // Render products
        function renderSearchProducts(products) {
            const productsContainer = document.getElementById('searchProducts');
            const productList = document.getElementById('searchProductList');
            
            if (!productsContainer || !productList) return;
            
            if (!products || products.length === 0) {
                productsContainer.classList.remove('show');
                return;
            }
            
            productList.innerHTML = products.map(product => `
                <a href="/modules/product/product-detail.html?slug=${product.slug}" class="search-product-item">
                    <div class="search-product-image">
                        <img src="${product.imageUrl || '/assets/img/placeholder.png'}" 
                             alt="${product.name}" 
                             loading="lazy"
                             onerror="this.src='/assets/img/placeholder.png'">
                    </div>
                    <div class="search-product-info">
                        <p class="search-product-name">${product.name}</p>
                        <div class="search-product-prices">
                            <span class="search-product-price">${formatPrice(product.price)}</span>
                        </div>
                        ${product.ratingAverage ? `
                            <div class="search-product-rating">
                                <span class="stars">${generateStars(product.ratingAverage)}</span>
                                <span class="count">(${product.reviewCount || 0})</span>
                            </div>
                        ` : ''}
                    </div>
                </a>
            `).join('');
            
            productsContainer.classList.add('show');
        }

        // Show loading state
        function showLoading(show) {
            const loading = document.getElementById('searchLoading');
            const products = document.getElementById('searchProducts');
            const empty = document.getElementById('searchEmpty');
            
            if (loading) loading.style.display = show ? 'flex' : 'none';
            if (show) {
                if (products) products.classList.remove('show');
                if (empty) empty.style.display = 'none';
            }
            
            SearchState.isLoading = show;
        }

        // Show empty state
        function showEmpty(show) {
            const empty = document.getElementById('searchEmpty');
            if (empty) empty.style.display = show ? 'flex' : 'none';
        }

        // Show/hide dropdown
        function showDropdown(show) {
            const dropdown = document.getElementById('searchDropdown');
            if (dropdown) {
                if (show) {
                    dropdown.classList.add('show');
                } else {
                    dropdown.classList.remove('show');
                }
            }
        }

        // Perform search
        async function performSearch(keyword) {
            if (!keyword || keyword.trim().length < 2) {
                showDropdown(false);
                return;
            }
            
            showDropdown(true);
            showLoading(true);
            showEmpty(false);
            
            // Render suggestions (now awaited)
            await renderSuggestions(keyword);
            
            // Fetch products from API
            const products = await searchProducts(keyword);
            
            showLoading(false);
            
            if (products.length === 0) {
                showEmpty(true);
                document.getElementById('searchProducts')?.classList.remove('show');
            } else {
                showEmpty(false);
                renderSearchProducts(products);
            }
            
            SearchState.lastKeyword = keyword;
        }

        // Debounced search input handler
        window.onSearchInput = function(value) {
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) {
                clearBtn.style.display = value.length > 0 ? 'block' : 'none';
            }
            
            // Clear previous timer
            if (SearchState.debounceTimer) {
                clearTimeout(SearchState.debounceTimer);
            }
            
            // If empty, hide dropdown
            if (!value || value.trim().length < 2) {
                showDropdown(false);
                return;
            }
            
            // Set new timer
            SearchState.debounceTimer = setTimeout(() => {
                performSearch(value);
            }, SearchState.debounceDelay);
        };

        // Search focus handler
        window.onSearchFocus = function() {
            const input = document.getElementById('searchInput');
            if (input && input.value.trim().length >= 2) {
                performSearch(input.value);
            }
        };

        // Clear search
        window.clearSearch = function() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('searchClearBtn');
            
            if (input) {
                input.value = '';
                input.focus();
            }
            if (clearBtn) {
                clearBtn.style.display = 'none';
            }
            
            showDropdown(false);
        };

        // Handle suggestion click
        window.handleSuggestionClick = function(suggestion) {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = suggestion;
                performSearch(suggestion);
            }
        };

        // Handle form submit (search)
        window.handleSearch = function(event) {
            event.preventDefault();
            const input = document.getElementById('searchInput');
            if (input && input.value.trim()) {
                // Navigate to search results page
                window.location.href = `/modules/product/shop-list.html?search=${encodeURIComponent(input.value.trim())}`;
            }
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const searchContainer = document.getElementById('searchContainer');
            if (searchContainer && !searchContainer.contains(e.target)) {
                showDropdown(false);
            }
        });

        // Handle keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                showDropdown(false);
                document.getElementById('searchInput')?.blur();
            }
        });

        console.log('✅ Search functionality initialized');
    })();
    
    // ==================== CART BADGE UPDATE ====================
    (function() {
        // Update cart badge with current cart count
        async function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            if (!badge) return;
            
            try {
                // Check if user is logged in
                if (typeof TokenHelper !== 'undefined' && TokenHelper.isLoggedIn()) {
                    const baseUrl = window.BASE_URL || 'http://127.0.0.1:8080';
                    const token = TokenHelper.getAccessToken();
                    
                    const response = await fetch(`${baseUrl}/api/cart`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const items = data.payload?.items || data.items || [];
                        const totalItems = items.reduce((sum, item) => sum + (item.quantity || 0), 0);
                        badge.textContent = totalItems;
                    } else {
                        badge.textContent = '0';
                    }
                } else {
                    // Not logged in, show 0
                    badge.textContent = '0';
                }
            } catch (error) {
                console.error('Error updating cart badge:', error);
                badge.textContent = '0';
            }
        }
        
        // Update cart badge on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateCartBadge);
        } else {
            updateCartBadge();
        }
        
        // Listen for cart update events
        window.addEventListener('cartUpdated', updateCartBadge);
        
        // Make function global so other pages can call it
        window.updateCartBadge = updateCartBadge;
        
        console.log('✅ Cart badge initialized');
    })();
</script>
<script>
    // Ensure page content doesn't jump when header is fixed.
    (function() {
        const header = document.querySelector('.shop-header');
        if (!header) return;

        function adjustBodyPadding() {
            const h = header.offsetHeight || 0;
            // apply padding-top to body so content starts below fixed header
            document.body.style.paddingTop = h + 'px';
        }

        // Adjust immediately and on load/resize/fonts load
        adjustBodyPadding();
        window.addEventListener('load', adjustBodyPadding);
        window.addEventListener('resize', adjustBodyPadding);

        // In case dynamic content changes header height
        const ro = new ResizeObserver(adjustBodyPadding);
        ro.observe(header);
    })();
</script>
